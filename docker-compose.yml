services:
  authserver:
    build: ./authserver
    container_name: authserver
    ports:
      - "9000:9000"
    networks:
      - s2s-net

  menuservice:
    build: ./menuservice
    container_name: menuservice
    ports:
      - "8082:8082"
    environment:
      JWK_SET_URI: http://authserver:9000/oauth2/jwks
    depends_on:
      - authserver
    networks:
      - s2s-net

  orderservice:
    build: ./orderservice
    container_name: orderservice
    ports:
      - "8083:8083"
    environment:
      JWK_SET_URI: http://authserver:9000/oauth2/jwks
    depends_on:
      - authserver
    networks:
      - s2s-net

  ordercreationservice:
    build: ./ordercreationservice
    container_name: ordercreationservice
    ports:
      - "8081:8081"
    environment:
      MENU_URL: http://menuservice:8082
      ORDER_URL: http://orderservice:8083
      JWK_SET_URI: http://authserver:9000/oauth2/jwks
      TOKEN_URI: http://authserver:9000/oauth2/token
    depends_on:
      - menuservice
      - orderservice
      - authserver
    networks:
      - s2s-net

  gatewayservice:
    build: ./gatewayservice
    container_name: gatewayservice
    ports:
      - "8080:8080"
    environment:
      ORDERCREATION_URL: http://ordercreationservice:8081
      TOKEN_URI: http://authserver:9000/oauth2/token
    depends_on:
      - ordercreationservice
      - authserver
    networks:
      - s2s-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver'
      - '--enable-feature=native-histograms'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - s2s-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - s2s-net

  k6:
    image: grafana/k6:latest
    container_name: k6
    profiles: ["tools"]
    volumes:
      - ./k6:/scripts:ro
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: "p(50),p(90),p(95),p(99),min,max,avg"
      K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM: "true"
      GATEWAY_URL: http://gatewayservice:8080
    entrypoint: ["k6", "run", "-o", "experimental-prometheus-rw", "/scripts/script.js"]
    networks:
      - s2s-net

networks:
  s2s-net:
    driver: bridge
