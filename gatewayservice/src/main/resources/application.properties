spring.application.name=gatewayservice
server.port=8080

management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Outbound mTLS: trust CA + present client cert (PKCS12 keystore)
spring.cloud.gateway.httpclient.ssl.trusted-x509-certificates[0]=file:/certs/ca.crt
spring.cloud.gateway.httpclient.ssl.key-store=file:/certs/gatewayservice.p12
spring.cloud.gateway.httpclient.ssl.key-store-password=changeit

spring.cloud.gateway.routes[0].id=ordercreation
spring.cloud.gateway.routes[0].uri=${ORDERCREATION_URL:https://ordercreationservice:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/orders/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/orders,/orders
