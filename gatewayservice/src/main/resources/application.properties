spring.application.name=gatewayservice
server.port=8080

management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

spring.security.oauth2.client.registration.gateway-client.client-id=gateway-client
spring.security.oauth2.client.registration.gateway-client.client-secret=gateway-secret
spring.security.oauth2.client.registration.gateway-client.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.gateway-client.scope=s2s.call
spring.security.oauth2.client.provider.gateway-client.token-uri=${TOKEN_URI:http://localhost:9000/oauth2/token}

spring.cloud.gateway.routes[0].id=ordercreation
spring.cloud.gateway.routes[0].uri=${ORDERCREATION_URL:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/orders/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/orders,/orders
spring.cloud.gateway.routes[0].filters[1]=OAuth2ClientCredentials
