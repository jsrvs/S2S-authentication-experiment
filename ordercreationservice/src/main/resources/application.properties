spring.application.name=ordercreationservice
server.port=8081

management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI:http://localhost:9000/oauth2/jwks}

spring.security.oauth2.client.registration.ordercreation-client.client-id=ordercreation-client
spring.security.oauth2.client.registration.ordercreation-client.client-secret=ordercreation-secret
spring.security.oauth2.client.registration.ordercreation-client.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.ordercreation-client.scope=s2s.call
spring.security.oauth2.client.provider.ordercreation-client.token-uri=${TOKEN_URI:http://localhost:9000/oauth2/token}

downstream.menu.url=${MENU_URL:http://localhost:8082}
downstream.order.url=${ORDER_URL:http://localhost:8083}
